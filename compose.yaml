name: hafo

# Three "nodes", each a MySQL + Redis + agent trio on one bridge network, plus
# three coordinators (one leads) and a router. Container names are fixed so
# chaos tooling can target them directly (docker pause hafo-mysql-1).

x-mysql: &mysql
  image: mysql:8.4.13
  env_file: deploy/dev.env
  environment:
    # The entrypoint's timezone load is binlogged; skipping it keeps every
    # node's gtid_executed empty until bootstrap, so no GTIDs are errant.
    MYSQL_INITDB_SKIP_TZINFO: "1"
  healthcheck:
    # TCP to 127.0.0.1 fails while the entrypoint's init server runs with
    # --skip-networking, so "healthy" means the real server is up.
    test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 90s
  stop_grace_period: 30s
  networks: [hanet]

x-redis: &redis
  image: redis:7.4.9-alpine
  # No persistence: health records, leases and the topology are rebuilt by
  # their writers. A Redis that restarts empty must not vote until every lease
  # it might have held has expired, or a second coordinator could win a
  # majority while the first still leads; so it sleeps longer than the
  # longest lease TTL (leader: 3s) before starting ("delayed restart").
  command: ["sh", "-c", "sleep 4 && exec redis-server --save '' --appendonly no --maxmemory 64mb"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 2s
    retries: 15
  networks: [hanet]

# The agent is its own container, not a process inside the MySQL container:
# pausing or killing MySQL must not silence the thing that reports it.
x-hafo: &hafo
  # One image for agent, coordinator and router, built once by agent-1; the
  # other services reuse the tag (parallel builds of the same tag collide).
  image: hafo:local
  pull_policy: never
  env_file: deploy/dev.env
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/healthz"]
    interval: 2s
    timeout: 2s
    retries: 15
  networks: [hanet]

services:
  mysql-1:
    <<: *mysql
    container_name: hafo-mysql-1
    hostname: mysql-1
    command: ["--server-id=1", "--report-host=mysql-1"]
    ports: ["127.0.0.1:33061:3306"]
    volumes:
      - ./deploy/mysql/hafo.cnf:/etc/mysql/conf.d/hafo.cnf:ro
      - ./deploy/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - mysql-1-data:/var/lib/mysql
      - backups:/backups

  mysql-2:
    <<: *mysql
    container_name: hafo-mysql-2
    hostname: mysql-2
    command: ["--server-id=2", "--report-host=mysql-2"]
    ports: ["127.0.0.1:33062:3306"]
    volumes:
      - ./deploy/mysql/hafo.cnf:/etc/mysql/conf.d/hafo.cnf:ro
      - ./deploy/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - mysql-2-data:/var/lib/mysql
      - backups:/backups

  mysql-3:
    <<: *mysql
    container_name: hafo-mysql-3
    hostname: mysql-3
    command: ["--server-id=3", "--report-host=mysql-3"]
    ports: ["127.0.0.1:33063:3306"]
    volumes:
      - ./deploy/mysql/hafo.cnf:/etc/mysql/conf.d/hafo.cnf:ro
      - ./deploy/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - mysql-3-data:/var/lib/mysql
      - backups:/backups

  redis-1:
    <<: *redis
    container_name: hafo-redis-1
    hostname: redis-1
    ports: ["127.0.0.1:63791:6379"]

  redis-2:
    <<: *redis
    container_name: hafo-redis-2
    hostname: redis-2
    ports: ["127.0.0.1:63792:6379"]

  redis-3:
    <<: *redis
    container_name: hafo-redis-3
    hostname: redis-3
    ports: ["127.0.0.1:63793:6379"]

  agent-1:
    <<: *hafo
    build:
      context: .
      target: hafo
    pull_policy: build
    container_name: hafo-agent-1
    hostname: agent-1
    command: ["hafo-agent", "-node=mysql-1", "-mysql-addr=mysql-1:3306"]
    ports: ["127.0.0.1:19101:9100"]

  agent-2:
    <<: *hafo
    container_name: hafo-agent-2
    hostname: agent-2
    command: ["hafo-agent", "-node=mysql-2", "-mysql-addr=mysql-2:3306"]
    ports: ["127.0.0.1:19102:9100"]

  agent-3:
    <<: *hafo
    container_name: hafo-agent-3
    hostname: agent-3
    command: ["hafo-agent", "-node=mysql-3", "-mysql-addr=mysql-3:3306"]
    ports: ["127.0.0.1:19103:9100"]

  coordinator-1:
    <<: *hafo
    container_name: hafo-coordinator-1
    hostname: coordinator-1
    command: ["hafo-coordinator", "-id=coordinator-1"]
    ports: ["127.0.0.1:19201:9100"]

  coordinator-2:
    <<: *hafo
    container_name: hafo-coordinator-2
    hostname: coordinator-2
    command: ["hafo-coordinator", "-id=coordinator-2"]
    ports: ["127.0.0.1:19202:9100"]

  coordinator-3:
    <<: *hafo
    container_name: hafo-coordinator-3
    hostname: coordinator-3
    command: ["hafo-coordinator", "-id=coordinator-3"]
    ports: ["127.0.0.1:19203:9100"]

  # Clients connect here: 23306 for writes (primary), 23307 for reads.
  router:
    <<: *hafo
    container_name: hafo-router
    hostname: router
    command: ["hafo-router"]
    ports: ["127.0.0.1:23306:3306", "127.0.0.1:23307:3307", "127.0.0.1:19300:9100"]

  # Streams the binary log of a healthy replica into the binlogs volume and
  # follows the cluster through failovers (cmd/hafo-archiver).
  archiver:
    build:
      context: .
      target: tools
    image: hafo-tools:local
    pull_policy: build
    container_name: hafo-archiver
    hostname: archiver
    env_file: deploy/dev.env
    command: ["hafo-archiver"]
    ports: ["127.0.0.1:19400:9100"]
    volumes:
      - binlogs:/archive
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [hanet]

  # One-shot tools for restores: `docker compose run --rm tools ...`.
  tools:
    profiles: ["tools"]
    image: hafo-tools:local
    pull_policy: never
    env_file: deploy/dev.env
    entrypoint: []
    volumes:
      - backups:/backups
      - binlogs:/archive
    networks: [hanet]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: hafo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    # 19090 on the host: 9090 is commonly taken by kubectl port-forwards.
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks: [hanet]

  # Dashboard: provisioned datasource and dashboard (deploy/grafana), open to
  # anonymous viewers because this is a local lab. http://127.0.0.1:19500
  grafana:
    image: grafana/grafana:11.5.2
    container_name: hafo-grafana
    hostname: grafana
    ports: ["127.0.0.1:19500:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: hafo-grafana-dev
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hafo.json
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [hanet]

  # Renders dashboard PNGs (make screenshot). Not started by `up`.
  renderer:
    profiles: ["screenshots"]
    image: grafana/grafana-image-renderer:3.12.1
    container_name: hafo-renderer
    hostname: renderer
    networks: [hanet]

  # Not started by `up`. Built once, then run in a node's network namespace
  # (docker run --network container:hafo-mysql-2 ...) to shape or cut traffic
  # without installing tc/iptables in the MySQL image.
  nettools:
    profiles: ["tools"]
    build: deploy/nettools
    image: hafo-nettools:local

networks:
  hanet:
    name: hafo-net

volumes:
  # Backups and the binlog archive outlive the MySQL volumes: a restore drill
  # deletes every node's data and rebuilds it from these two.
  backups:
  binlogs:
  mysql-1-data:
  mysql-2-data:
  mysql-3-data:
  prometheus-data:
